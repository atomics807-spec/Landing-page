<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>Offline - Paraysco Consulting</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b1220; color: #e2e8f0; }
      .card { background: #111827; border-color: #1f2937; }
      .muted { color: #94a3b8; }
    }
    .card {
      max-width: 30rem;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px -12px rgba(0,0,0,0.15);
    }
    .badge {
      width: 4rem; height: 4rem;
      border-radius: 9999px;
      background: #0d9488;
      color: #fff;
      font-size: 1.75rem; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    .muted { color: #64748b; margin: 0 0 1.5rem; line-height: 1.6; }
    button {
      background: #0d9488; color: #fff; border: none;
      padding: 0.75rem 1.25rem; border-radius: 0.6rem;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0f766e; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">P</div>
    <h1>You&rsquo;re offline</h1>
    <p class="muted">
      Paraysco Consulting can&rsquo;t reach the network right now.
      Some content may still be available from your last visit.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
